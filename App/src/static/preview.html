  <style>
    *{box-sizing:border-box}body{margin:0;background:#eeeade;color:#173c30;font-family:"Microsoft YaHei","PingFang SC",sans-serif}main{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:80px;padding:36px}aside{width:410px}.eyebrow{font-size:12px;letter-spacing:3px;color:#668074}h1{font-family:"STSong","SimSun",serif;font-size:48px;line-height:1.3;margin:24px 0}p{font-size:15px;line-height:1.9;color:#5a7166}ol{padding-left:23px;font-size:14px;line-height:2.3;color:#4a6659}nav{display:flex;gap:12px;margin:30px 0}a{padding:13px 20px;border-radius:14px;background:#206b52;color:white;text-decoration:none;font-size:14px}a.secondary{background:#dbe6ce;color:#1f6b52}.note{font-size:12px;color:#7e897e;border-top:1px solid #d0d9ca;padding-top:20px}.device{width:410px;height:864px;flex-shrink:0;border:10px solid #193b30;border-radius:38px;overflow:hidden;box-shadow:0 28px 70px #193b3026;background:#f7f3e8}iframe{display:block;width:390px;height:844px;border:0;background:#f7f3e8}@media(max-width:800px){main{padding:0}aside{display:none}.device{border:0;border-radius:0;width:100%;height:100dvh;box-shadow:none}iframe{width:100%;height:100dvh}}@media(min-width:801px) and (max-height:950px){.device{height:calc(100vh - 50px)}iframe{height:calc(100vh - 70px)}}

<body>
  <main>
    <aside>
      <span class="eyebrow">FAMILY NUTRITION · V0.1</span>
      <h1>把一家人的饭，<br>安排明白。</h1>
      <p>Uni-app 微信小程序交互原型。用一次家庭用餐任务，把档案、对话、菜单、采购与反馈串起来。</p>
      <ol><li>演示登录，四步完成家庭建档</li><li>问“今晚全家吃什么”，查看共享菜单</li><li>确认采购清单，继续看做饭步骤</li><li>演示拍照记录，确认份量和用油</li><li>返回营养师，接着安排下一餐</li></ol>
      <nav><a href="/#/" target="prototype">从登录开始</a><a class="secondary" href="/#/pages/chat/index" target="prototype">直接看 AI 主页</a></nav>
      <p class="note">仅供产品评审。登录、语音、模型结果与商品均为演示；档案和记录仅在本机保存。尚未接入 Supabase、真实 AI、商城支付及订阅消息。</p>
    </aside>
    <div class="device"><iframe name="prototype" title="家庭营养师小程序原型" src="/#/pages/chat/index"></iframe></div>
  </main>
